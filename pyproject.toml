[project]
name = "donkeykong"
version = "1.0.0"
description = "Donkey Kong — recreación arcade clásico en Python/pygame-ce"
authors = [{ name = "davidvivo-ia" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame-ce>=2.5.0",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "pytest-mock>=3.14",
]

[project.scripts]
donkeykong = "donkeykong.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/donkeykong"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "N", "B", "A", "C4", "PTH", "RUF"]
ignore = ["E501", "N806", "A002"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["pygame", "pygame.*", "structlog", "structlog.*", "typer", "typer.*", "rich", "rich.*", "pydantic", "pydantic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing -q"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
